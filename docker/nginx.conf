# docker/nginx.conf
# Konfigurasi Nginx untuk melayani frontend Inventra AI
# dan mem-proxy request API ke backend FastAPI

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index dashboard.html index.html;

    # Kompresi gzip untuk performa
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(css|js|png|jpg|ico|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls ke backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS headers untuk development
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Proxy ke backend docs
    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    # SPA fallback — semua route ke dashboard.html
    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    # Health check endpoint untuk load balancer
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
